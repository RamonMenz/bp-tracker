name: CI

# Verificações a cada PR e a cada push em main. Nenhum job usa `secrets.*` de propósito: os
# testes mockam o Firebase e as security rules rodam no emulador com um projectId fictício,
# então nada aqui precisa de .env.local, google-services.json ou token. Se um dia algum job
# precisar de variáveis, a fonte é a EAS (`eas env:pull`, como em eas-build.yml) — nunca
# duplicar segredo em GitHub Secrets.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo no mesmo PR/branch cancela a execução anterior, ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-bridge:
    name: Bridge OCR (Java puro, sem Android/ML Kit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Política de linhas e buffers com entradas sintéticas
        run: |
          mkdir -p "$RUNNER_TEMP/aferi-photo-checks"
          javac -d "$RUNNER_TEMP/aferi-photo-checks" \
            native-modules/aferi-photo-capture/android/src/main/java/expo/modules/aferiphoto/FrameBytes.java \
            native-modules/aferi-photo-capture/android/src/main/java/expo/modules/aferiphoto/OcrLinePolicy.java \
            native-modules/aferi-photo-capture/android/src/main/java/expo/modules/aferiphoto/FrameTransform.java \
            native-modules/aferi-photo-capture/android/src/main/java/expo/modules/aferiphoto/CaptureRun.java \
            native-modules/aferi-photo-capture/checks/FrameBytesTest.java \
            native-modules/aferi-photo-capture/checks/FrameTransformTest.java \
            native-modules/aferi-photo-capture/checks/CaptureRunTest.java \
            native-modules/aferi-photo-capture/checks/OcrLinePolicyTest.java
          java -cp "$RUNNER_TEMP/aferi-photo-checks" expo.modules.aferiphoto.FrameBytesTest
          java -cp "$RUNNER_TEMP/aferi-photo-checks" expo.modules.aferiphoto.OcrLinePolicyTest
          java -cp "$RUNNER_TEMP/aferi-photo-checks" expo.modules.aferiphoto.FrameTransformTest
          java -cp "$RUNNER_TEMP/aferi-photo-checks" expo.modules.aferiphoto.CaptureRunTest

  app:
    name: App (lint, typecheck e testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Jest)
        run: npm test -- --ci

      - name: Diagnóstico Metro (PowerShell, fixtures sem rede)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiMetroConnection.check.ps1

      - name: Inspector de rede da demo (mod real Expo)
        run: node tools/task07/AferiNetworkInspector.check.cjs

      - name: Regras de backup da demo (mods reais Expo, sem dispositivo)
        run: node tools/task07/AferiBackupRules.check.cjs

      - name: Inspector e regras de backup da demo de voz (mods reais Expo)
        run: |
          node tools/task07/AferiNetworkInspector.check.cjs --voice
          node tools/task07/AferiBackupRules.check.cjs --voice

      - name: Build, identidade e saúde Metro da voz (PowerShell, simulações)
        run: |
          pwsh -NoLogo -NoProfile -File tools/task12/Build-AferiVoiceEvaluation.check.ps1
          pwsh -NoLogo -NoProfile -File tools/task12/Test-AferiVoiceInstalled.check.ps1
          pwsh -NoLogo -NoProfile -File tools/task12/Test-AferiVoiceMetro.check.ps1

      - name: Coletor de metadados (PowerShell, ADB simulado)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiPrivacyMetadata.check.ps1

      - name: Guardas do idle candidato (PowerShell, sem dispositivo)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiInspectorIdle.check.ps1

      - name: Atualização restrita de avaliação (PowerShell, ADB simulado)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiInspectorUpdate.check.ps1

      - name: Guardas do build de avaliação (PowerShell, sem Gradle)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiInspectorBuild.check.ps1

      - name: Guardas do candidato ROI (PowerShell, sem Gradle ou dispositivo)
        run: pwsh -NoLogo -NoProfile -File tools/task09/AferiRoiCandidate.check.ps1

      - name: Inspeção dirigida ROI591 (PowerShell, smali/ADB simulados)
        run: pwsh -NoLogo -NoProfile -File tools/task09/AferiRoi591Readiness.check.ps1

      - name: Atualização ROI591 restrita (PowerShell, sem dispositivo)
        run: pwsh -NoLogo -NoProfile -File tools/task09/AferiRoi591Update.check.ps1

      - name: Metro ROI591 (PowerShell, HTTP/ADB simulados)
        run: pwsh -NoLogo -NoProfile -File tools/task09/AferiRoi591Metro.check.ps1

      - name: Preparo offline ROI591 (PowerShell, ADB simulado)
        run: pwsh -NoLogo -NoProfile -File tools/task09/AferiRoi591Offline.check.ps1

      - name: Comparação de assinaturas (PowerShell, apksigner simulado)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiApkSignatures.check.ps1

      - name: Regras empacotadas (PowerShell, aapt2 simulado)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiBackupMetadata.check.ps1

      - name: Manifesto selecionado (PowerShell, aapt2 simulado)
        run: pwsh -NoLogo -NoProfile -File tools/task07/AferiManifestMetadata.check.ps1

  functions:
    name: Cloud Functions (build e testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependências das Functions
        run: npm --prefix functions ci

      - name: Compilar as Functions
        run: npm --prefix functions run build

      - name: Testes das Functions (Jest)
        run: npm --prefix functions test

  rules:
    name: Security Rules (emulador do Firestore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O JAR do emulador é baixado na primeira execução. A versão do firebase-tools (e,
      # portanto, a do emulador) está travada no package-lock.json — por isso a chave do cache.
      - name: Cache do emulador do Firestore
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Testar security rules
        run: npm run test:rules
