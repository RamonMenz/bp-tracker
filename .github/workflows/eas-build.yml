name: EAS Build (development)

# Disparo manual pela aba Actions do GitHub — de propósito, não a cada push. O plano
# gratuito da EAS tem cota mensal de builds; automatizar por push consumiria a cota rápido
# demais para uma fase de testes. Rode manualmente quando quiser gerar um build novo.
on:
  workflow_dispatch: {}

# Config pública do Firebase (CLAUDE.md §4.4 — não é segredo, o que protege os dados são as
# Security Rules + App Check). Precisa estar disponível ANTES do `eas env:pull`: o próprio
# `app.config.ts` usa `requireEnv` pra essas chaves e é avaliado internamente pelo `eas-cli` só
# pra descobrir o projeto — sem elas aqui, `env:pull` falha tentando ler a config que ele mesmo
# deveria preencher. Cadastradas como "Variables" (não "Secrets") em Settings → Secrets and
# variables → Actions → Variables, uma por uma, com os mesmos nomes abaixo.
env:
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

jobs:
  build_android_development:
    name: Build Android (development)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar eas-cli
        run: npm install -g eas-cli

      # Baixa as EXPO_PUBLIC_* já cadastradas na EAS (ver `eas env:create` no README de setup)
      # e materializa o google-services.json (variável de arquivo) — evita duplicar segredo
      # em dois lugares (GitHub Secrets e EAS Environment Variables).
      - name: Baixar variáveis de ambiente do ambiente "development" na EAS
        run: eas env:pull --environment development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Rodar build Android (profile development)
        run: eas build --platform android --profile development --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
