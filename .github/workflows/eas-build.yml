name: EAS Build

# Disparo manual pela aba Actions do GitHub — de propósito, não a cada push. O plano
# gratuito da EAS tem cota mensal de builds; automatizar por push consumiria a cota rápido
# demais para uma fase de testes. Rode manualmente quando quiser gerar um build novo.
#
# Perfis (decisões e fontes em docs/eas-standalone.md):
#   - development: Dev Client (precisa do Metro no PC). Comportamento de sempre: dispara e não espera.
#   - standalone-teste: APK release com o JavaScript embutido e a voz Android LIGADA (só nesse perfil).
#     Roda um pré-voo nativo gratuito no runner, espera o build da EAS terminar e traz o log
#     completo (Gradle/Kotlin) para este log, com a URL da página do build ao final.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil do eas.json
        type: choice
        options:
          - development
          - standalone-teste
        default: development
      build_id:
        description: "(só standalone-teste) ID de um build EAS já existente: NÃO cria build novo, só acompanha e traz o log"
        type: string
        required: false
        default: ''
      preflight:
        description: "(só standalone-teste) Compilar o Kotlin no runner antes de gastar um build da EAS"
        type: boolean
        default: true

permissions:
  contents: read

# Um build por vez: um segundo disparo espera o primeiro terminar (nunca cancela um build em curso).
concurrency:
  group: eas-build
  cancel-in-progress: false

jobs:
  build_android_development:
    name: Build Android (development)
    if: inputs.profile == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar eas-cli
        run: npm install -g eas-cli

      # Baixa as EXPO_PUBLIC_* já cadastradas na EAS (ver `eas env:create` no README de setup)
      # e materializa o google-services.json (variável de arquivo) — evita duplicar segredo
      # em dois lugares (GitHub Secrets e EAS Environment Variables).
      - name: Baixar variáveis de ambiente do ambiente "development" na EAS
        run: eas env:pull --environment development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Rodar build Android (profile development)
        run: eas build --platform android --profile development --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Gratuito (não usa a EAS nem segredo): prebuild com config Firebase FICTÍCIA e compilação do
  # Kotlin/Java de todos os módulos nativos no Android SDK que já vem no runner. Pega erro de
  # Kotlin do módulo de voz antes de gastar a cota. Também confere que o bundle JS com a flag
  # ligada contém a voz.
  preflight_nativo:
    name: Pré-voo nativo (standalone-teste)
    if: inputs.profile == 'standalone-teste' && inputs.build_id == '' && inputs.preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_ANDROID_VOICE_ENABLED: 'true'
      EXPO_PUBLIC_FIREBASE_API_KEY: fixture-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-aferi.invalid
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-aferi
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:1234567890:android:0000000000000000'
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1234567890-fixture.apps.googleusercontent.com
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Bundle JS Android com a voz ligada
        run: |
          out="$RUNNER_TEMP/export-android"
          npx expo export -p android --output-dir "$out" --max-workers 2
          bundle=$(find "$out" -name '*.hbc' | head -n 1)
          count=$(grep -a -c 'Verificar voz local' "$bundle" || true)
          echo "Ocorrências de 'Verificar voz local' no bundle: $count"
          test "$count" -gt 0 || { echo "::error::Flag ligada mas a voz não entrou no bundle"; exit 1; }

      - name: Prebuild Android (config fictícia)
        run: |
          cat > "$RUNNER_TEMP/google-services.json" <<'JSON'
          {"project_info":{"project_number":"1234567890","project_id":"demo-aferi","storage_bucket":"demo-aferi.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0000000000000000","android_client_info":{"package_name":"com.ramonmenz.bptracker"}},"oauth_client":[],"api_key":[{"current_key":"fixture-api-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          GOOGLE_SERVICES_JSON="$RUNNER_TEMP/google-services.json" npx expo prebuild --platform android --no-install
          grep -E 'RECORD_AUDIO|CAMERA' android/app/src/main/AndroidManifest.xml || true

      - name: Compilar Kotlin/Java (release) de todos os módulos
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain --stacktrace

  build_android_standalone:
    name: Build Android (standalone-teste)
    needs: preflight_nativo
    if: >-
      !cancelled() && inputs.profile == 'standalone-teste' &&
      (needs.preflight_nativo.result == 'success' || needs.preflight_nativo.result == 'skipped')
    runs-on: ubuntu-latest
    # A fila do plano gratuito pode demorar; se o job estourar, o build segue na EAS e pode ser
    # acompanhado depois com o input build_id (sem gastar cota).
    timeout-minutes: 180
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar eas-cli
        run: npm install -g eas-cli@27.11.0

      - name: Conferir o secret EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN ausente (Settings > Secrets and variables > Actions)."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # O arquivo vai para fora do repositório e nunca é impresso. O script mascara cada valor no
      # log e lista só os NOMES. As variáveis de arquivo (google-services.json) que o env:pull
      # grava em .eas/.env são apagadas: o build da EAS recebe as variáveis no servidor pelo campo
      # "environment" do perfil, e esse arquivo não deve subir junto com o projeto.
      - name: Variáveis do ambiente "development" da EAS (só nomes)
        id: envnames
        run: |
          eas env:pull --environment development --non-interactive --path "$RUNNER_TEMP/eas-development.env"
          node tools/eas/env-names.cjs "$RUNNER_TEMP/eas-development.env"
          rm -rf .eas/.env
          echo "Perfil standalone-teste acrescenta (eas.json > env): EXPO_PUBLIC_ANDROID_VOICE_ENABLED"
          git status --porcelain
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build EAS (espera terminar)
        id: build
        run: |
          if [ -n "$INPUT_BUILD_ID" ]; then
            build_id="$INPUT_BUILD_ID"
            [[ "$build_id" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::build_id inválido (esperado UUID)"; exit 1; }
            echo "Acompanhando o build existente $build_id (nenhum build novo é criado)."
            while true; do
              status=$(eas build:view "$build_id" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).status)}catch{console.log("?")}})')
              echo "$(date -u +%H:%M:%S) status: $status"
              case "$status" in FINISHED|ERRORED|CANCELED) break ;; esac
              sleep 60
            done
          else
            set +e
            eas build --platform android --profile standalone-teste --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
            echo "eas build terminou com código $?"
            set -e
            build_id=$(node -e 'try{const b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log((Array.isArray(b)?b[0]:b).id??"")}catch{console.log("")}' "$RUNNER_TEMP/build.json")
          fi
          if [ -z "$build_id" ]; then
            echo "::error::Nenhum build foi criado na EAS (veja a saída acima: config, credenciais ou cota)."
            exit 1
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}

      - name: Log completo do build EAS
        id: report
        if: ${{ !cancelled() && steps.build.outputs.build_id != '' }}
        run: |
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build-final.json"
          node tools/eas/build-report.cjs "$RUNNER_TEMP/build-final.json"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}

      # Sem gastar cota: baixa o APK pronto e confere, sem imprimir valores, que o JS está
      # embutido, que a voz entrou, e que o debug token do App Check NÃO está no APK.
      - name: Inspecionar o APK
        if: ${{ !cancelled() && steps.report.outputs.status == 'FINISHED' }}
        run: |
          apk="$RUNNER_TEMP/app.apk"
          curl -sSfL "$APK_URL" -o "$apk"
          echo "Tamanho do APK: $(du -h "$apk" | cut -f1)"
          unzip -l "$apk" | grep -E 'assets/index\.android\.bundle' || { echo "::error::APK sem bundle JS embutido"; exit 1; }
          echo "Voz no bundle ('Verificar voz local'): $(unzip -p "$apk" assets/index.android.bundle | grep -a -c 'Verificar voz local' || true)"
          echo "Módulo nativo de voz nos dex: $(unzip -p "$apk" 'classes*.dex' | grep -a -c 'expo/modules/aferivoice' || true)"
          echo "Dev launcher nos dex (esperado 0 em release, informativo): $(unzip -p "$apk" 'classes*.dex' | grep -a -c 'expo/modules/devlauncher/launcher/DevLauncherActivity' || true)"
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$aapt" ]; then "$aapt" dump permissions "$apk" | grep -E 'RECORD_AUDIO|CAMERA|POST_NOTIFICATIONS' || true; fi
          token=$(grep -E '^EXPO_PUBLIC_APPCHECK_DEBUG_TOKEN=' "$RUNNER_TEMP/eas-development.env" | head -n 1 | cut -d= -f2- || true)
          if [ -n "$token" ]; then
            hits=$(unzip -p "$apk" | grep -a -c -F "$token" || true)
            if [ "$hits" = "0" ]; then echo "Debug token do App Check: AUSENTE do APK."; else echo "::error::Debug token do App Check PRESENTE no APK ($hits ocorrências). Não distribua este APK."; exit 1; fi
          else
            echo "Debug token do App Check: não legível no ambiente development (ausente ou secret; ver a lista de nomes acima)."
          fi
        env:
          APK_URL: ${{ steps.report.outputs.apk_url }}

      - name: Resultado
        if: ${{ !cancelled() && steps.build.outputs.build_id != '' }}
        run: |
          echo "Status: $STATUS"
          echo "Página do build: $PAGE_URL"
          test "$STATUS" = "FINISHED"
        env:
          STATUS: ${{ steps.report.outputs.status }}
          PAGE_URL: ${{ steps.report.outputs.page_url }}
