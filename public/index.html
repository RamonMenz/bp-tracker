<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Sem maximum-scale nem user-scalable=no de propósito: desabilitar zoom quebraria o WCAG
         1.4.4 (Resize Text) e prejudicaria diretamente o público idoso do app (CLAUDE.md §4.7). O
         auto-zoom do Safari ao focar um campo — motivo mais comum para alguém adicionar essas
         restrições — já é resolvido por outro caminho: fonte ≥16px em todo input (BpNumberInput,
         Field, DateTimeField.web), que impede o Safari de disparar o zoom automático.

         Este arquivo versiona o template HTML que a build web ('single' output) de fato usa —
         `expo export -p web` prioriza public/index.html sobre o template embutido no @expo/cli
         instalado quando ele existe (ver createTemplateHtmlAsync em
         @expo/cli/build/src/start/server/webTemplate.js). Sem ele, o comportamento correto de
         hoje dependeria de um default não versionado, que uma atualização futura do Expo poderia
         mudar sem que ninguém notasse. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Ícone da aba do navegador e da instalação como PWA ("Adicionar à tela de início"). Sem
         isso, o navegador não tinha de onde tirar um ícone em resolução alta pra tela inicial do
         celular e caía pra um fallback borrado (upscaling de um favicon pequeno, ou um recorte da
         própria página). manifest.json + apple-touch-icon cobrem Android/Chrome e iOS/Safari,
         que leem esses ícones por caminhos diferentes. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <!-- iOS ignora manifest.json pra "Adicionar à Tela de Início" — precisa dessas duas tags à
         parte pra abrir em standalone (sem a barra do Safari) com o nome certo embaixo do ícone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BP Tracker" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
